<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/made-for-stream-mark.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://connect-js.stripe.com" crossorigin />
    <link rel="preconnect" href="https://js.stripe.com" crossorigin />
    <link rel="preconnect" href="https://m.stripe.network" crossorigin />
    <link rel="dns-prefetch" href="https://connect-js.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://m.stripe.network" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F7F7FF" />
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("creatorhub-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Made for Stream — For creators, by creators</title>
    <meta name="description" content="Made for Stream connects creators with artists, editors and riggers for emotes, overlays, VTuber models and other digital assets and services. For creators, by creators." />
    <link rel="canonical" href="https://madeforstream.com/" />
    <meta property="og:url" content="https://madeforstream.com/" />
    <meta property="og:site_name" content="Made for Stream" />
    <meta property="og:title" content="Made for Stream — For creators, by creators" />
    <meta property="og:description" content="Discover creator-made digital assets and services for your next stream or video." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
