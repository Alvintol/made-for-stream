STRIPE_KEY_MODE: "prod"
TWITCH_CLIENT_ID: "gatzvrrm2z68zy3quxitpt6lp4gbmd"
TWITCH_REDIRECT_URI: "https://made-for-stream-api-prod-422533033771.us-central1.run.app/api/twitch/connect/callback"
EMAIL_SMTP_HOST: "smtp.mx.cloudflare.net"
