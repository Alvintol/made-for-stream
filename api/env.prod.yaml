# Plain (non-secret) settings for the prod API, Cloud Run service
# made-for-stream-api-prod. Secrets are Secret Manager references, set with
# --set-secrets (docs/environments.md). Applied on the first deploy with
# --env-vars-file; later deploys keep them.
#
# No Stripe keys: payments aren't open (payments_are_live() is false), so prod
# runs without Stripe at all. Every Stripe route answers that Stripe isn't
# configured. Add the live keys and webhook secrets only at launch.
